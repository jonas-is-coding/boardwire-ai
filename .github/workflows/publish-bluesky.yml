name: Boardwire Publish Bluesky

on:
  # GitHub does not run scheduled workflows on time: this workflow's runs
  # started 0.5h late in early August 2026 and 2.5-8h late from the last week
  # of August on, which pushed posts meant for the 9:30 AM / 1:30 PM US
  # Eastern engagement windows to 1 PM / 4 PM. So instead of one cron per
  # window, the workflow polls every 30 minutes and config/schedule.json
  # decides which run may post: only inside a window (weekday morning and
  # midday, Sunday evening) and only 3h+ after the previous post. Off-the-hour
  # minutes avoid GitHub's top-of-the-hour queue. Manual dispatch publishes
  # immediately (BOARDWIRE_ENFORCE_PUBLISH_WINDOWS is only set for schedule).
  # NOTE: windows assume US Eastern DAYLIGHT time (EDT, UTC-4); shift the
  # windows in config/schedule.json +1h in US winter (EST, UTC-5).
  schedule:
    # Weekdays: every 30 min from 10:07 to 20:37 UTC covers the morning
    # (13:00-16:00 UTC) and midday (17:00-20:30 UTC) windows even when the
    # scheduler is 3-6h late.
    - cron: "7,37 10-20 * * 1-5"
    # Sunday: every 30 min from 18:07 to 23:37 UTC for the 21:30-24:00 UTC window.
    - cron: "7,37 18-23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Late runs pile up; serialise them so two runs never read the same
# published_posts.json and both post. A queued run checks out the branch tip
# (see Checkout), so it sees the post the previous run just committed.
concurrency:
  group: boardwire-publish-bluesky-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_bluesky:
    runs-on: ubuntu-latest
    environment: production
    env:
      BOARDWIRE_PUBLISHER: bluesky
      BOARDWIRE_REAL_PUBLISH_ENABLED: true
      # Scheduled runs are gated by config/schedule.json; manual runs are not.
      BOARDWIRE_ENFORCE_PUBLISH_WINDOWS: ${{ github.event_name == 'schedule' }}
      # Language(s) declared on every post (language-filtered feeds skip
      # posts without one) — comma-separated BCP-47 codes.
      BOARDWIRE_POST_LANGS: ${{ vars.BOARDWIRE_POST_LANGS || 'en' }}
      # Sarah packaging chain — override when a provider retires a model.
      BOARDWIRE_GROQ_MODEL: ${{ vars.BOARDWIRE_GROQ_MODEL }}
      BOARDWIRE_CEREBRAS_MODEL: ${{ vars.BOARDWIRE_CEREBRAS_MODEL }}
      BOARDWIRE_MISTRAL_MODEL: ${{ vars.BOARDWIRE_MISTRAL_MODEL }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      SLACK_WEBHOOK_URL_CLAIRE: ${{ secrets.SLACK_WEBHOOK_URL_CLAIRE }}
      SLACK_WEBHOOK_URL_CHLOE: ${{ secrets.SLACK_WEBHOOK_URL_CHLOE }}
      SLACK_WEBHOOK_URL_MADISON: ${{ secrets.SLACK_WEBHOOK_URL_MADISON }}
      SLACK_WEBHOOK_URL_SARAH: ${{ secrets.SLACK_WEBHOOK_URL_SARAH }}
      SLACK_WEBHOOK_URL_DEBUG: ${{ secrets.SLACK_WEBHOOK_URL_DEBUG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The branch tip at checkout time, not the commit the schedule was
          # queued on: a run that waited in the concurrency queue must see the
          # post the previous run committed (spacing + dedupe read that file).
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Publish approved to Bluesky (real)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m src.main --publish-approved --publisher bluesky --confirm-real-publish

      - name: Commit publishing state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/published_posts.json data/review_queue.json reports/review_queue.md articles/
          git add data/published_releases.json data/gate_rejections.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No publish state changes to commit"
          else
            git commit -m "chore: update bluesky published posts"

            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi

              echo "Push failed on attempt ${attempt}; rebasing onto latest ${GITHUB_REF_NAME} before retrying"
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
            done

            echo "Push failed after 3 attempts" >&2
            exit 1
          fi
