name: Boardwire Reply Digest

on:
  # Weekdays 05:37 UTC = 07:37 Berlin (CEST). GitHub currently fires scheduled
  # runs 2.5-5h late (the 07:15 cron landed at 12:06 UTC = 14:06 Berlin), so
  # the cron sits early enough that the digest still reaches Slack in the
  # morning and the 1-3 manual replies go out while the posts are fresh.
  # Read-only: author feeds on the public AppView, keyword search through the
  # authenticated PDS (the public host answers 403 to searchPosts from CI),
  # plus one Slack webhook POST — this workflow never posts to Bluesky.
  # NOTE: in Berlin winter (CET, UTC+1) this fires at 06:37 local time.
  schedule:
    - cron: "37 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reply_digest:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Handle excludes Boardwire's own posts; the app password only opens a
      # read session for searchPosts (no record is ever written here).
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      # Reply-suggestion chain — override when a provider retires a model.
      BOARDWIRE_GROQ_MODEL: ${{ vars.BOARDWIRE_GROQ_MODEL }}
      BOARDWIRE_CEREBRAS_MODEL: ${{ vars.BOARDWIRE_CEREBRAS_MODEL }}
      BOARDWIRE_MISTRAL_MODEL: ${{ vars.BOARDWIRE_MISTRAL_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      SLACK_WEBHOOK_URL_SARAH: ${{ secrets.SLACK_WEBHOOK_URL_SARAH }}
      SLACK_WEBHOOK_URL_DEBUG: ${{ secrets.SLACK_WEBHOOK_URL_DEBUG }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send reply digest to Slack (suggestions only)
        run: python -m src.main --reply-digest
